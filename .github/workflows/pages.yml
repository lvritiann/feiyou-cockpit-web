name: 部署 GitHub Pages (Actions 模式)

# 当 main 分支有 push 时，立刻把仓库内容部署到 Pages（约 30 秒生效，替代 legacy 的 3-6 分钟 build）
# 前提：仓库 Settings → Pages → Build and deployment → Source 选 "GitHub Actions"
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 防止两个 workflow 并行部署冲突
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
