name: 驾驶舱图表每日刷新 (10:00 北京)

# 每日北京时间 10:00 自动重建 index.html（读取 AirScript 推送的 data.json）
# 触发：定时(cron) + 手动(workflow_dispatch)
on:
  schedule:
    # UTC 02:00 = 北京时间 10:00
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库（含 AirScript 推送的 data.json）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装依赖（openpyxl，仅 --from-json 之外的回退路径使用）
        run: pip install --quiet openpyxl

      - name: 拉取远端最新 data.json（AirScript 已在 08:30/09:00 推送）
        run: git pull --ff-only origin main || true

      - name: 由 data.json 重建 index.html（联动仪表盘）
        run: python build_dashboard.py --from-json

      - name: 提交并推送更新
        run: |
          git config user.name "cockpit-bot"
          git config user.email "bot@local"
          git add data.json index.html
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 每日重建驾驶舱图表 $(date +%F)"
            git push --force-with-lease
          fi
